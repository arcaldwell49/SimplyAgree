home:
  title: "SimplyAgree: Bland-Altman, Tolerance Limits & Reliability (ICC) in R"
  description: >
    R package and jamovi module for method comparison studies: Bland-Altman
    limits of agreement, tolerance limits, concordance correlation (CCC),
    ICCs, and Deming/Passing-Bablok regression for simple, repeated, and
    nested data.

url: https://aaroncaldwell.us/SimplyAgree

template:
  bootstrap: 5
  math-rendering: mathjax
  light-switch: true
  bslib:
    bootswatch: minty
  opengraph:
    image:
      src: images/sticker.png
      alt: "SimplyAgree logo"

reference:

- title: "Tolerance & Agreement"

- subtitle: "Limits Calculations"
  contents:
  - tolerance_limit
  - agreement_limit

- subtitle: "Methods"
  contents:
